{% extends 'admin/base.html' %}

{% block head_css %}
  {{ super() }}
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_theme.css') }}">
{% endblock %}

{% block access_control %}
<div class="navbar-nav ml-auto d-flex align-items-center gap-2">
  <a href="{{ url_for('index') }}" class="btn btn-sm btn-command-outline rounded-pill px-3 mr-2">
    <i class="bi bi-box-arrow-up-right me-1"></i> Public Site
  </a>
  <span class="badge px-3 py-2 mr-2 rounded-pill font-weight-bold" 
        style="background: rgba(225, 29, 72, 0.2); border: 1px solid rgba(225, 29, 72, 0.4); color: #fda4af;">
    <i class="bi bi-shield-lock-fill me-1"></i> Chief Officer: {{ current_user.username }}
  </span>
  <a href="{{ url_for('logout') }}" class="btn btn-sm btn-command-action rounded-pill px-3">
    <i class="bi bi-power me-1"></i> Terminate
  </a>
</div>
{% endblock %}
