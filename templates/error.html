<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code|default('Error') }} — BloodBridge Security</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-base: #050811;
            --bg-card: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            --red-brand: #e11d48;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .ambient-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 50% 30%, rgba(225, 29, 72, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(37, 99, 235, 0.12) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .error-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 540px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(225, 29, 72, 0.15);
        }

        .error-code-badge {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #fb7185, #e11d48, #9f1239);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.75rem;
        }

        .error-message {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-action-primary {
            background: linear-gradient(135deg, #e11d48, #be123c);
            border: none;
            color: white;
            font-weight: 700;
            padding: 0.75rem 1.75rem;
            border-radius: 9999px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.25s ease;
            box-shadow: 0 10px 25px -5px rgba(225, 29, 72, 0.4);
        }

        .btn-action-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(225, 29, 72, 0.6);
            color: white;
        }

        .btn-action-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.25s ease;
        }

        .btn-action-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }
    </style>
</head>
<body>

    <div class="ambient-mesh"></div>

    <div class="error-card">
        <div class="mb-3">
            <i class="bi bi-shield-exclamation text-danger" style="font-size: 2.8rem;"></i>
        </div>
        <div class="error-code-badge">{{ error_code|default('404') }}</div>
        <h2 class="error-title">{{ error_title|default('Page Not Found') }}</h2>
        <p class="error-message">{{ error_message|default('The requested page does not exist or has been moved to another location.') }}</p>
        
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a href="{{ url_for('index') }}" class="btn-action-primary">
                <i class="bi bi-house-door-fill"></i> Return Home
            </a>
            <a href="javascript:history.back()" class="btn-action-secondary">
                <i class="bi bi-arrow-left"></i> Go Back
            </a>
        </div>
    </div>

</body>
</html>
